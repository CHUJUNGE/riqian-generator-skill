<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riqian PSD renderer</title>
<style>
  body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #1e3028; background: #f5f4ef; }
  main { max-width: 760px; margin: 30px auto; padding: 26px; background: white; border-radius: 12px; box-shadow: 0 8px 28px #1e30281a; }
  h1 { margin: 0 0 8px; font-size: 25px; } p { margin: 8px 0 18px; color: #506158; }
  label { display: block; font-weight: 650; margin: 15px 0 5px; } input { width: 100%; box-sizing: border-box; }
  button { margin-top: 20px; border: 0; border-radius: 7px; background: #347a54; color: white; font: inherit; font-weight: 650; padding: 10px 17px; cursor: pointer; }
  button:disabled { background: #9aa79f; cursor: wait; } #status { margin: 16px 0 0; padding: 10px; border-radius: 6px; background: #edf3ee; white-space: pre-wrap; }
  iframe { width: 100%; height: 250px; margin-top: 24px; border: 1px solid #d9e1db; border-radius: 8px; }
</style>
<main>
  <h1>日签 PSD 生成器</h1>
  <p>在浏览器中运行。选择母版与已人工确认的内容包后，会下载可编辑 PSD、PNG 和 manifest。文件会被发送至 Photopea 的网页应用处理；本工具不设自有上传服务器。</p>
  <label for="template">PSD 母版</label>
  <input id="template" type="file" accept=".psd,application/octet-stream">
  <label for="payload">已确认的 payload.json</label>
  <input id="payload" type="file" accept="application/json,.json">
  <button id="run" type="button">生成 PSD 与 PNG</button>
  <div id="status" role="status">正在初始化浏览器渲染器…</div>
  <iframe id="photopea" title="Photopea renderer" src="https://www.photopea.com/"></iframe>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const frame = $("photopea");
  const status = $("status");
  const run = $("run");
  let ready = false, state = "idle", payload, templateBuffer, exported = [];
  const setStatus = message => { status.textContent = message; };
  const send = message => frame.contentWindow.postMessage(message, "*");
  const download = (buffer, name, type) => {
    const url = URL.createObjectURL(new Blob([buffer], { type }));
    const a = document.createElement("a"); a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const text = (field, limit) => {
    const value = payload.text && payload.text[field];
    if (typeof value !== "string" || !value.trim() || value.length > limit) throw new Error(`${field} 缺失或超过 ${limit} 个字符`);
    return value;
  };
  const validate = () => {
    if (payload.approved !== true) throw new Error("payload 未标记为人工确认（approved: true）");
    if (!Array.isArray(payload.sources) || payload.sources.length < 2) throw new Error("payload 至少需要两条独立来源");
    if (!payload.asset_license || !payload.asset_license.status) throw new Error("payload 缺少素材许可记录");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(payload.date || "")) throw new Error("date 必须是 YYYY-MM-DD");
    text("month", 3); text("day", 2); text("separator", 1); text("quote", 54); text("attribution", 28); text("source", 38);
  };
  const script = () => {
    const fields = {
      month: text("month", 3), day: text("day", 2), separator: text("separator", 1),
      quote: text("quote", 54), attribution: text("attribution", 28), source: text("source", 38)
    };
    const literal = JSON.stringify(fields);
    return `
      (function () {
        var values = ${literal};
        var aliases = {
          month: ["riqian.date.month", "Apr"], day: ["riqian.date.day", "01"],
          separator: ["riqian.date.separator", "/"], quote: ["riqian.quote", "大勇若怯，大智如愚"],
          context: ["riqian.attribution", "星期五 宜逗乐（愚人节） 苹果公司创立"]
        };
        function collect(parent, wanted, found) {
          for (var i = 0; i < parent.layers.length; i++) {
            var layer = parent.layers[i];
            if (layer.name === wanted) found.push(layer);
            if (layer.layers) collect(layer, wanted, found);
          }
        }
        function get(name) {
          var choices = aliases[name], matches = [];
          for (var i = 0; i < choices.length; i++) collect(app.activeDocument, choices[i], matches);
          if (matches.length !== 1) throw new Error("Expected one mapped layer for " + name + ", found " + matches.length);
          if (matches[0].kind !== LayerKind.TEXT) throw new Error("Mapped layer for " + name + " is not text");
          return matches[0];
        }
        get("month").textItem.contents = values.month;
        get("day").textItem.contents = values.day;
        get("separator").textItem.contents = values.separator;
        get("quote").textItem.contents = values.quote;
        get("context").textItem.contents = values.attribution + " · " + values.source;
        app.activeDocument.saveToOE("psd:true");
        app.activeDocument.saveToOE("png");
      }());`;
  };
  const finalize = () => {
    if (exported.length !== 2) throw new Error(`导出不完整：收到 ${exported.length}/2 个文件`);
    const base = `${payload.date}-riqian`;
    download(exported[0], `${base}.psd`, "application/octet-stream");
    download(exported[1], `${base}.png`, "image/png");
    const manifest = { candidate_id: payload.candidate_id, approved: true, generated_at: new Date().toISOString(), sources: payload.sources, asset_license: payload.asset_license, files: [`${base}.psd`, `${base}.png`] };
    download(JSON.stringify(manifest, null, 2), `${base}.manifest.json`, "application/json");
    state = "complete"; run.disabled = false; setStatus("完成：已下载 PSD、PNG 和 manifest。PSD 可直接在 Photoshop 中继续编辑。");
  };
  window.addEventListener("message", event => {
    if (event.source !== frame.contentWindow) return;
    if (event.data instanceof ArrayBuffer) { exported.push(event.data); return; }
    if (event.data !== "done") return;
    try {
      if (!ready) { ready = true; run.disabled = false; setStatus("就绪：选择 PSD 母版和已确认的 payload.json。"); return; }
      if (state === "opening") { state = "rendering"; setStatus("正在更新可编辑文字层并导出…"); send(script()); return; }
      if (state === "rendering") finalize();
    } catch (error) { state = "idle"; run.disabled = false; setStatus("生成失败：" + error.message); }
  });
  run.addEventListener("click", async () => {
    try {
      if (!ready) throw new Error("渲染器尚未就绪");
      const psd = $("template").files[0], json = $("payload").files[0];
      if (!psd || !json) throw new Error("请选择 PSD 母版和 payload.json");
      payload = JSON.parse(await json.text()); validate();
      templateBuffer = await psd.arrayBuffer(); exported = []; state = "opening"; run.disabled = true;
      setStatus("正在打开 PSD 母版…"); send(templateBuffer);
    } catch (error) { run.disabled = false; setStatus("无法开始：" + error.message); }
  });
})();
</script>
